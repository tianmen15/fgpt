name: video_app
description: 万能视频播放器 - 支持自定义壁纸、播放列表、音乐搜索下载、随机图片
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  http: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  flutter_cache_manager: ^3.4.1
  dio: ^5.7.0
  just_audio: ^0.9.42
  mobile_scanner: ^5.2.0
  flutter_tts: ^4.0.0
  device_info_plus: ^10.0.0
  sensors_plus: ^4.0.0
  share_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/